name: Android

on:
  pull_request:
    paths:
      - "AgromindAI-appandroid/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "AgromindAI-appandroid/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgromindAI-appandroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: |
          ./gradlew testDirectDebugUnitTest
          ./gradlew testPlayDebugUnitTest
      - name: Lint
        run: ./gradlew lintDirectDebug
      - name: Assemble both distributions
        run: |
          ./gradlew assembleDirectDebug
          ./gradlew assemblePlayDebug
      - name: Compile baseline profile and macrobenchmark suite
        run: ./gradlew :benchmark:compileBenchmarkKotlin

  ui-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgromindAI-appandroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: cd AgromindAI-appandroid && ./gradlew connectedDirectDebugAndroidTest
