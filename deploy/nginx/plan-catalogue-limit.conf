# Install in nginx's http context, after cloudflare-origin.conf. The origin
# must already trust only Cloudflare and restore the real visitor IP there.
# Empty keys skip unrelated endpoints; include plan-catalogue-server.inc in
# the API server, and verify that its locations inherit limit_req.
map $uri $agromind_plan_limit_key {
    default "";
    ~^/api/engagement/plans/?$ $binary_remote_addr;
}
limit_req_zone $agromind_plan_limit_key zone=agromind_plan_reads:10m rate=10r/s;
